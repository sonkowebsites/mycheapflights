<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b00ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)" />
  
  <!-- Orbit ring -->
  <ellipse cx="50" cy="50" rx="38" ry="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="4 3" transform="rotate(-20 50 50)" />
  
  <!-- Dollar sign tag -->
  <circle cx="25" cy="30" r="10" fill="rgba(0,255,170,0.9)" filter="url(#glow)" />
  <text x="25" y="34" font-family="Arial" font-weight="bold" font-size="11" fill="#000" text-anchor="middle">$</text>
  
  <!-- Airplane body -->
  <g transform="rotate(-30 50 50)" filter="url(#glow)">
    <!-- Main fuselage -->
    <ellipse cx="50" cy="50" rx="22" ry="5" fill="url(#planeGrad)" />
    <!-- Nose -->
    <polygon points="72,50 62,47 62,53" fill="url(#planeGrad)" />
    <!-- Tail fin -->
    <polygon points="28,50 32,50 30,40" fill="rgba(255,255,255,0.8)" />
    <!-- Left wing -->
    <polygon points="52,50 44,50 36,40 46,42" fill="url(#planeGrad)" />
    <!-- Right wing -->
    <polygon points="52,50 44,50 36,60 46,58" fill="rgba(255,255,255,0.85)" />
    <!-- Engine -->
    <ellipse cx="48" cy="44" rx="5" ry="2" fill="rgba(0,212,255,0.7)" />
  </g>
  
  <!-- Speed lines / contrail -->
  <line x1="15" y1="58" x2="30" y2="55" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="62" x2="24" y2="60" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Stars -->
  <circle cx="75" cy="22" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="82" cy="35" r="1" fill="white" opacity="0.6"/>
  <circle cx="20" cy="75" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="70" cy="78" r="1" fill="white" opacity="0.5"/>
</svg>
